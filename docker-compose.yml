services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: orvia
      POSTGRES_PASSWORD: orvia
      POSTGRES_DB: orvia
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvia -d orvia"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - orvia_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  orvia_postgres:
